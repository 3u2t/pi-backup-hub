<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden · Pi Backup Hub</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">↗</div><p class="eyebrow">DEIN RASPBERRY PI</p><h1>Pi Backup Hub</h1><p class="muted">Ein Ort für deine Festplatten-Sicherungen und neue Immich-Erinnerungen.</p>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Benutzername<input name="username" autocomplete="username" value="admin" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required autofocus></label>{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}<button class="primary wide" type="submit">Anmelden <span>→</span></button></form><p class="tiny">Beim ersten Start stehen die Zugangsdaten in der Datei <code>admin-password.txt</code> im privaten App-Verzeichnis.</p></main></body></html>
